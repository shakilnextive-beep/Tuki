name: 🐞 Report a problem
description: Something in Tuki doesn't work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tuki version
      description: Right-click the Tuki menu bar icon — the version is shown there.
      placeholder: "1.0.0"
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 15.4"
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images here if they help.
