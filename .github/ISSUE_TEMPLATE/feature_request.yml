name: 💡 Suggest a feature
description: An idea to make Tuki better.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like Tuki to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it helps
      description: When would you use it?
